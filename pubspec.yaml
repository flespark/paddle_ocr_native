name: paddle_ocr_native
description: "Offline PaddleOCR PP-OCRv6 text detection and recognition for Flutter on Android and iOS, powered by ONNX Runtime."
version: 0.1.0
repository: https://github.com/flespark/paddle_ocr_native
issue_tracker: https://github.com/flespark/paddle_ocr_native/issues
topics:
  - ocr
  - paddleocr
  - onnx
  - computer-vision

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flespark.paddle_ocr_native
        pluginClass: PaddleOcrNativePlugin
      ios:
        pluginClass: PaddleOcrNativePlugin

  assets:
    - assets/models/det/inference.onnx
    - assets/models/det/inference.yml
    - assets/models/rec/inference.onnx
    - assets/models/rec/inference.yml
